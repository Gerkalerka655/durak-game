<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Дурак — Игра</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="game-screen">
      <!-- Верхняя панель -->
      <div class="game-header">
        <div class="trump-info">
          <span class="trump-label">Козырь:</span>
          <span class="trump-suit" id="trump-suit">♠</span>
        </div>
        <div class="deck-info">
          <span id="deck-count">24</span> 🎴
        </div>
        <div class="turn-info" id="turn-info">
          Ход: Атака
        </div>
      </div>
      
      <!-- Игроки сверху -->
      <div class="opponents" id="opponents">
        <!-- Оппоненты рендерятся здесь -->
      </div>
      
      <!-- Игровой стол -->
      <div class="table-area" id="table-area">
        <div class="table-placeholder">Стол пуст</div>
      </div>
      
      <!-- Мои карты -->
      <div class="my-hand" id="my-hand">
        <!-- Карты игрока -->
      </div>
      
      <!-- Кнопки действий -->
      <div class="game-actions" id="game-actions">
        <button id="take-btn" class="btn btn-take hidden">🤚 Взять карты</button>
        <button id="done-btn" class="btn btn-done hidden">✅ Бито</button>
      </div>
      
      <!-- Результат игры -->
      <div class="game-result hidden" id="game-result">
        <div class="result-content">
          <h2 id="result-title">Игра окончена!</h2>
          <p id="result-message"></p>
          <button class="btn btn-primary" onclick="location.href='index.html'">🏠 В меню</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    const socket = io('https://durak-game-it0a.onrender.com'); // ЗАМЕНИТЕ НА ВАШ URL
    const roomId = localStorage.getItem('durak_roomId');
    
    if (!roomId) {
      window.location.href = 'index.html';
    }
    
    // DOM элементы
    const trumpSuitEl = document.getElementById('trump-suit');
    const deckCountEl = document.getElementById('deck-count');
    const turnInfoEl = document.getElementById('turn-info');
    const opponentsEl = document.getElementById('opponents');
    const tableAreaEl = document.getElementById('table-area');
    const myHandEl = document.getElementById('my-hand');
    const takeBtn = document.getElementById('take-btn');
    const doneBtn = document.getElementById('done-btn');
    const gameResultEl = document.getElementById('game-result');
    const resultTitleEl = document.getElementById('result-title');
    const resultMessageEl = document.getElementById('result-message');
    
    let gameState = null;
    let selectedCard = null;
    
    // Переподключаемся к комнате
    socket.emit('join-room', {
      roomId: roomId,
      userData: tg.initDataUnsafe?.user || {}
    });
    
    socket.on('game-update', (state) => {
      gameState = state;
      renderGame();
    });
    
    socket.on('game-started', (state) => {
      gameState = state;
      renderGame();
    });
    
    function renderGame() {
      if (!gameState) return;
      
      // Обновляем инфо
      trumpSuitEl.textContent = gameState.trumpSuit;
      deckCountEl.textContent = gameState.deckCount;
      
      // Инфо о ходе
      const myIndex = gameState.myIndex;
      const isMyTurn = myIndex === gameState.currentPlayerIndex;
      const isAttacker = myIndex === gameState.attackerIndex;
      const isDefender = myIndex === gameState.defenderIndex;
      
      let turnText = '';
      if (isAttacker) turnText = '🔥 Ваша атака!';
      else if (isDefender) turnText = '🛡️ Вы защищаетесь!';
      else turnText = '👀 Наблюдаете...';
      turnInfoEl.textContent = turnText;
      
      // Показываем/скрываем кнопки
      if (isDefender && gameState.table.length > 0) {
        takeBtn.classList.remove('hidden');
      } else {
        takeBtn.classList.add('hidden');
      }
      
      if (isAttacker && gameState.table.length > 0 && gameState.table.every(p => p.beatenBy)) {
        doneBtn.classList.remove('hidden');
      } else {
        doneBtn.classList.add('hidden');
      }
      
      // Рендер оппонентов
      renderOpponents();
      
      // Рендер стола
      renderTable();
      
      // Рендер моих карт
      renderMyCards();
      
      // Проверка конца игры
      if (gameState.status === 'finished') {
        showResult();
      }
    }
    
    function renderOpponents() {
      opponentsEl.innerHTML = '';
      gameState.players.forEach((player, index) => {
        if (index === gameState.myIndex) return;
        
        const opponentCard = document.createElement('div');
        opponentCard.className = `opponent-card ${player.isAttacker ? 'attacker' : ''} ${player.isDefender ? 'defender' : ''}`;
        
        const avatar = player.photoUrl 
          ? `<img src="${player.photoUrl}" class="opp-avatar">`
          : `<div class="opp-avatar-placeholder">${player.firstName[0]}</div>`;
        
        opponentCard.innerHTML = `
          ${avatar}
          <div class="opp-info">
            <div class="opp-name">${player.firstName}</div>
            <div class="opp-cards">${player.cardCount} 🃏</div>
          </div>
          ${player.isAttacker ? '<span class="role-badge attack">⚔️</span>' : ''}
          ${player.isDefender ? '<span class="role-badge defend">🛡️</span>' : ''}
        `;
        
        opponentsEl.appendChild(opponentCard);
      });
    }
    
    function renderTable() {
      if (gameState.table.length === 0) {
        tableAreaEl.innerHTML = '<div class="table-placeholder">Стол пуст</div>';
        return;
      }
      
      tableAreaEl.innerHTML = '';
      gameState.table.forEach((pair, index) => {
        const pairEl = document.createElement('div');
        pairEl.className = 'card-pair';
        
        const attackCard = createCardElement(pair.card, false);
        pairEl.appendChild(attackCard);
        
        if (pair.beatenBy) {
          const defendCard = createCardElement(pair.beatenBy, false);
          defendCard.classList.add('beaten');
          pairEl.appendChild(defendCard);
        }
        
        tableAreaEl.appendChild(pairEl);
      });
    }
    
    function renderMyCards() {
      myHandEl.innerHTML = '';
      const myCards = gameState.myCards;
      
      // Сортируем: козыри в конец, внутри мастей по рангу
      const suitOrder = { '♠': 0, '♥': 1, '♦': 2, '♣': 3 };
      myCards.sort((a, b) => {
        const aIsTrump = a.suit === gameState.trumpSuit;
        const bIsTrump = b.suit === gameState.trumpSuit;
        if (aIsTrump && !bIsTrump) return 1;
        if (!aIsTrump && bIsTrump) return -1;
        if (a.suit !== b.suit) return suitOrder[a.suit] - suitOrder[b.suit];
        return a.value - b.value;
      });
      
      myCards.forEach(card => {
        const cardEl = createCardElement(card, true);
        cardEl.addEventListener('click', () => onCardClick(card, cardEl));
        myHandEl.appendChild(cardEl);
      });
    }
    
    function createCardElement(card, isInteractive) {
      const el = document.createElement('div');
      el.className = `card ${card.suit === '♥' || card.suit === '♦' ? 'red' : 'black'} ${isInteractive ? 'interactive' : ''}`;
      el.dataset.cardId = card.id;
      
      const isTrump = card.suit === gameState?.trumpSuit;
      
      el.innerHTML = `
        <div class="card-corner top-left">
          <span class="card-rank">${card.rank}</span>
          <span class="card-suit">${card.suit}</span>
        </div>
        <div class="card-center">${card.suit}</div>
        <div class="card-corner bottom-right">
          <span class="card-rank">${card.rank}</span>
          <span class="card-suit">${card.suit}</span>
        </div>
        ${isTrump ? '<div class="trump-mark">★</div>' : ''}
      `;
      
      return el;
    }
    
    function onCardClick(card, cardEl) {
      // Убираем выделение с предыдущей
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
      
      selectedCard = card;
      cardEl.classList.add('selected');
      
      // Автоматически делаем ход
      makeMove(card.id);
    }
    
    function makeMove(cardId) {
      socket.emit('make-move', { cardId }, (response) => {
        if (!response.success) {
          tg.showPopup({ title: 'Неверный ход', message: response.error });
          document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
        }
        selectedCard = null;
      });
    }
    
    takeBtn.addEventListener('click', () => {
      socket.emit('take-cards', {}, (response) => {
        if (!response.success) {
          tg.showPopup({ title: 'Ошибка', message: response.error });
        }
      });
    });
    
    doneBtn.addEventListener('click', () => {
      socket.emit('end-turn');
    });
    
    function showResult() {
      gameResultEl.classList.remove('hidden');
      if (gameState.loser) {
        const isLoser = gameState.players[gameState.myIndex]?.firstName === gameState.loser;
        resultTitleEl.textContent = isLoser ? '😵 Вы дурак!' : '🎉 Победа!';
        resultMessageEl.textContent = isLoser 
          ? 'Вы проиграли. В следующий раз повезёт!' 
          : `Победитель: ${gameState.winner}`;
      } else {
        resultTitleEl.textContent = '🤝 Ничья!';
      }
    }
    
    // Инициализация
    const savedState = localStorage.getItem('durak_gameState');
    if (savedState) {
      gameState = JSON.parse(savedState);
      renderGame();
    }
  </script>
</body>
</html>
